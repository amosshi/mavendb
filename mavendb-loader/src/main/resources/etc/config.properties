#
# OpenSearch Properties
#
# OpenSearch server URL (default: http://localhost:9200)
org.mavendb.opensearch.url=http://127.0.0.1:9200
# User and password, only for a server with the security plugin; docker/compose-opensearch.yml disables it
#org.mavendb.opensearch.user=admin
#org.mavendb.opensearch.password=
# Documents per _bulk request (default: 10000, about 13 MB)
#org.mavendb.opensearch.batch.size=10000

#
# PSQL Properties
#
org.mavendb.psql.url=jdbc:postgresql://127.0.0.1:5432/mavendb
org.mavendb.psql.user=mavendbadmin
org.mavendb.psql.password=123456
#org.mavendb.psql.batch.size=50000

#
# SQLite Properties
#
# SQLite database file path (default: mavendb.sqlite in current directory)
org.mavendb.sqlite.url=jdbc:sqlite:mavendb.sqlite
# Batch size for SQLite writes (default: 20000)
# For 80-200 million records, this batch size provides good balance between memory usage and performance
# org.mavendb.sqlite.batch.size=100000

#
# DuckDB Properties
#
# DuckDB database file path (default: mavendb.duckdb in current directory)
org.mavendb.duckdb.url=jdbc:duckdb:mavendb.duckdb
# Batch size for DuckDB writes (default: 100000)
# org.mavendb.duckdb.batch.size=100000

#
# Maximum number of batches written to the database at the same time (virtual threads)
#
# - Default number is 4, valid range 2-64; SQLite always uses 1
# - Records are converted to rows on 2-8 extra threads (half the CPU cores), before the writers
# - Memory: at most (thread pool size + converter threads + 3) batches are held in memory:
#   one being filled, the ones being converted, the ones being written, and one ready to write
#org.mavendb.thread.pool.size=4
