name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-26.04    # x86_64, LTS
          - name: macos-arm64
            os: macos-latest    # Apple Silicon (M-series)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up OpenJDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install graphviz (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q graphviz

      - name: Install graphviz (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install graphviz

      - name: Show platform
        run: |
          uname -sm
          java -version
          dot -V

      # Same order as build.sh: the graphs are built from target/classes
      # and must exist before 'package' puts the class graph into the dist zip as doc/project.svg
      - name: Compile
        run: ./mvnw -B -ntp compile

      - name: Dependency graphs
        run: ./graphs.sh

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check the API jar is executable
        run: unzip -l mavendb-api/target/mavendb-api.jar | grep 'BOOT-INF/classes/org/mavendb/api/MavendbApiApplication.class'

      - name: Check class graph is in the dist zip
        run: unzip -l mavendb-loader/dist/*.zip | grep 'doc/project.svg'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.name }}
          path: '*/target/surefire-reports/'
          retention-days: 7
